version: '3.8'

x-common-config: &common-app
  env_file:
    - ../.env
  networks:
    - ticketing

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ticketing]

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ticketing]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ticketing]

  auth-service:
    <<: *common-app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: auth-service
    environment: &service-env
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_SECURE_SECRET: ${VNPAY_SECURE_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - '3000:3000'
    networks: [ticketing]

  event-service:
    <<: *common-app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: event-service
    environment:
      <<: *service-env
      PORT: 3002
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - '3002:3002'
    networks: [ticketing]

  booking-service:
    <<: *common-app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: booking-service
    environment:
      <<: *service-env
      PORT: 3003
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - '3003:3003'
    networks: [ticketing]

  order-service:
    <<: *common-app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: order-service
    environment:
      <<: *service-env
      PORT: 3004
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - '3004:3004'
    networks: [ticketing]

  payment-service:
    <<: *common-app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: payment-service
    environment:
      <<: *service-env
      PORT: 3005
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - '3005:3005'
    networks: [ticketing]

volumes:
  postgres_data:

networks:
  ticketing:
    driver: bridge
